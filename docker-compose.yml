version: "3.9"

services:
  java-service:
    build: ./java-service
    ports:
      - "8081:8080" # HTTP expose (Entry Point)
    expose:
      - "50052" # Java gRPC server (internal only)
    environment:
      - PYTHON_SERVICE_HOST=python-service
      - JAVA_SERVICE_HOST=java-service
    depends_on:
      - python-service
    networks:
      - grpc-net

  python-service:
    build:
      context: .
      dockerfile: python-service/Dockerfile
    expose:
      - "50051" # Only visible within Docker network
    environment:
      - JAVA_SERVICE_HOST=java-service
      - PYTHON_SERVICE_HOST=python-service
    networks:
      - grpc-net

networks:
  grpc-net:
    driver: bridge
